services:
  # ---- Nguồn dữ liệu giả lập (đóng vai Oracle trong bài thực hành) ----
  postgres:
    image: postgres:16
    container_name: delab-postgres
    environment:
      POSTGRES_USER: de
      POSTGRES_PASSWORD: de
      POSTGRES_DB: delab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ---- Spark cluster: 1 master + 2 worker ----
  spark-master:
    image: bitnami/spark:3.5
    container_name: delab-spark-master
    environment:
      SPARK_MODE: master
    ports:
      - "8080:8080"   # Master UI
      - "7077:7077"   # Cổng submit job
      - "4040:4040"   # Application UI (job đang chạy)
    volumes:
      - ../spark:/opt/work
      - ../data:/opt/data

  spark-worker-1:
    image: bitnami/spark:3.5
    container_name: delab-spark-worker-1
    depends_on: [spark-master]
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2G"
    volumes:
      - ../spark:/opt/work
      - ../data:/opt/data

  spark-worker-2:
    image: bitnami/spark:3.5
    container_name: delab-spark-worker-2
    depends_on: [spark-master]
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2G"
    volumes:
      - ../spark:/opt/work
      - ../data:/opt/data

volumes:
  pgdata:
